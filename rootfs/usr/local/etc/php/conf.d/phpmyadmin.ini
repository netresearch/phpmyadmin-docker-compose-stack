;
; Baseline PHP settings. The four limits an operator usually wants to change
; (upload, memory, execution time) are written by the entrypoint from the
; environment and land in zz-limits.ini, which loads after this file.

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

session.cookie_httponly = 1
session.cookie_samesite = "Strict"
session.use_strict_mode = 1

; phpMyAdmin is a large codebase and every request touches a lot of it.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 16000
opcache.validate_timestamps = 0
