[www]
; The container runs as www-data already; php-fpm must not try to switch.
user = www-data
group = www-data
listen = 0.0.0.0:9000

; /ping backs the container healthcheck (see HEALTHCHECK in the Dockerfile).
ping.path = /ping
ping.response = pong
pm.status_path = /status

pm = dynamic
pm.max_children = 12
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
; Recycle workers: phpMyAdmin's import/export paths can hold on to memory.
pm.max_requests = 500

; Without this php-fpm swallows the workers' output instead of forwarding it
; to the container log.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
